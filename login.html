<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedCSS Admin Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="center">

<div class="login-box">

  <h1>RedCSS Admin</h1>
  <p>Team Manager</p>

  <form id="loginForm">

    <input
      id="email"
      type="email"
      placeholder="Admin email"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      required
    >

    <button type="submit">Login</button>

  </form>

  <p id="message"></p>

</div>

<script src="js/login.js"></script>

</body>
</html>
